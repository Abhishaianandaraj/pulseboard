@if (!isAuthenticated()) {
  <!-- Clean Unauthenticated Entry Viewport -->
  <router-outlet></router-outlet>
} @else {
  <!-- Clean Minimalist Multi-Screen Shell -->
  <div class="pulse-shell">
    <!-- Slim Left Navigation Rail -->
    <aside class="nav-rail">
      <div class="rail-brand">
        <div class="rail-logo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
        </div>
        <div class="rail-brand-meta">
          <span class="brand-title">PulseBoard</span>
          <span class="brand-tag">v2.0</span>
        </div>
      </div>

      <!-- Navigation Links -->
      <nav class="rail-menu">
        <a
          routerLink="/my-day"
          routerLinkActive="active"
          class="rail-item"
          title="My Day · Personal Delivery Queue"
        >
          <span class="rail-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </span>
          <span class="rail-label">My Day</span>
        </a>

        <a
          routerLink="/workspace"
          routerLinkActive="active"
          class="rail-item"
          title="Workspace · Board, Sprint & Gantt"
        >
          <span class="rail-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="9"></rect>
              <rect x="14" y="3" width="7" height="5"></rect>
              <rect x="14" y="12" width="7" height="9"></rect>
              <rect x="3" y="16" width="7" height="5"></rect>
            </svg>
          </span>
          <span class="rail-label">Workspace</span>
        </a>

        <a
          routerLink="/projects"
          routerLinkActive="active"
          class="rail-item"
          title="Projects · Squad Directories & Health"
        >
          <span class="rail-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
          </span>
          <span class="rail-label">Projects</span>
        </a>

        <a
          routerLink="/governance"
          routerLinkActive="active"
          class="rail-item"
          title="Governance · RBAC, Telemetry & Audit"
        >
          <span class="rail-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
          </span>
          <span class="rail-label">Governance</span>
        </a>
      </nav>

      <!-- Rail Footer -->
      <div class="rail-footer">
        <button
          type="button"
          class="rail-action-btn"
          (click)="store.toggleTheme()"
          [title]="store.theme() === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
        >
          <span class="rail-icon">
            @if (store.theme() === 'dark') {
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
            } @else {
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
            }
          </span>
          <span class="rail-label">{{ store.theme() === 'dark' ? 'Light Mode' : 'Dark Mode' }}</span>
        </button>

        <button
          type="button"
          class="rail-action-btn btn-reset-rail"
          (click)="store.resetWorkspace()"
          title="Reset Workspace to Seed Demo State"
        >
          <span class="rail-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
          </span>
          <span class="rail-label">Reset Demo</span>
        </button>
      </div>
    </aside>

    <!-- Main Workspace Application Area -->
    <div class="shell-content">
      <!-- Compact Top Header Bar -->
      <header class="shell-top-bar">
        <!-- Left: Project Selector Pills (Strictly scoped to user visible projects) -->
        <div class="project-pill-nav">
          <button
            type="button"
            class="proj-pill-btn"
            [class.active]="store.selectedProjectId() === 'ALL'"
            (click)="selectProject('ALL')"
            title="Scope workspace to all visible projects"
          >
            <span>All Projects</span>
            <span class="proj-count-tag">{{ store.visibleProjects().length }}</span>
          </button>

          @for (proj of store.visibleProjects(); track proj.id) {
            <button
              type="button"
              class="proj-pill-btn"
              [class.active]="store.selectedProjectId() === proj.id"
              (click)="selectProject(proj.id)"
              [title]="proj.name + ' (' + proj.teamName + ')'"
            >
              <span class="proj-code-dot" [style.background]="proj.color"></span>
              <span>{{ proj.code }}</span>
            </button>
          }
        </div>

        <!-- Right: Current User Profile Pill & Sign Out -->
        <div class="top-user-group">
          <div class="user-profile-chip" [title]="'Logged in as ' + store.currentUser().name + ' (' + store.currentUser().role + ')'">
            <span class="user-chip-avatar" [style.background-color]="store.currentUser().color">
              {{ store.currentUser().avatar }}
            </span>
            <div class="user-chip-details">
              <span class="user-chip-name">{{ store.currentUser().name }}</span>
              <span class="user-chip-role font-mono">[{{ store.currentUserRole() }}]</span>
            </div>
          </div>

          <button
            type="button"
            class="btn-sign-out"
            (click)="logout()"
            title="Sign out of current workspace session"
          >
            Sign Out
          </button>
        </div>
      </header>

      <!-- Active Page Outlet Viewport -->
      <main class="shell-page-viewport">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>

  <!-- Global Standalone Slide-Over Task Inspection Drawer -->
  <app-task-drawer></app-task-drawer>
}
